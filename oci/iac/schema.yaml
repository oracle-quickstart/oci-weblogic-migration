title: "Oracle WebLogic Migration for Oracle Cloud Infrastructure"
description: "Migrate Oracle WebLogic Server to Oracle Cloud Infrastructure"
informationalText: "This stack provisions an OCI Virtual Cloud Network, OCI Compute Instances running a migrated Weblogic Domain, enables a OCI Load Balancer, and restores de necessary Weblogic archives stored in Object Storage"
schemaVersion: 1.1.0
version: "20190304"

source:
  type: quickstart

locale: "en"
variableGroups:
  - title: "Basic Hidden"
    variables:
      - tenancy_ocid
      - region
      - user_ocid
      - fingerprint
      - private_key_path
    visible: false

  - title: "General Configuration"
    variables:
      - domain_name
      - compartment_ocid
      - object_storage_bucket
      - image_mode
      - terms_and_conditions

  - title: "Virtual Cloud Networking"
    variables:
      - use_existent_vcn
      - network_compartment_id
      - wls_existing_vcn_id
      - wls_vcn_name
      - wls_vcn_cidr
      - create_new_subnets
      - subnet_compartment_id

  - title: "WebLogic Server Compute Instance"
    variables:
      - wls_instance_shape
      - wls_visibility
      - ssh_public_key

  - title: "Loadbalancer"
    variables:
      - load_balancer_shape
      - loadbalancer_authorized_cidrs_mgmt
      - loadbalancer_authorized_cidrs_service


  - title: "Bastion Configuration"
    variables:
       - bastion_customize_resource
       - bastion_allowed_cidrs
       - bastion_image_type
       - bastion_image_id
       - bastion_instance_shape
       - bastion_upgrade
       - output_detail
       - ssh_private_key


  - title: "Tagging"
    variables:
      - tag_values


  - title: "Extras Hidden"
    variables:
      - timezone
      - object_storage_bucket
      - instance_private_key
      - state_id
      - ssh_private_key_path
      - ssh_public_key_path
#TODO: JOI Review variables.
      - assign_weblogic_public_ip
      - generate_dg_tag
      - create_service_tag
      - create_policies
      - rms_existing_private_endpoint_id
      - is_rms_private_endpoint_required
      - add_rms_private_endpoint
    visible: false

  - title: "Extras Hidden - Images"
    variables:
      - marketplace_source_images
      - bastion_listing_id
      - bastion_listing_resource_version
      - instance_image_id
      - listing_id
      - listing_resource_version
      - ucm_instance_image_id
      - ucm_listing_id
      - ucm_listing_resource_version
      - use_marketplace_image
    visible: false

  - title: "Extras Hidden - LoadBalancer"
    variables:
      - add_lb_reserved_public_ip_id
      - add_load_balancer
      - backendset_name_for_existing_load_balancer
      - existing_lb_nsg_id
      - existing_load_balancer_id
      - lb_subnet_1_cidr
      - lb_subnet_1_name
      - lb_subnet_1_id
      - lb_subnet_2_name
      - lb_subnet_2_id
      - load_balancer_strategy_existing_subnet
      - load_balancer_strategy_new_subnet
      - is_lb_private
      - add_lb_reserved_public_ip_id
      - lb_reserved_public_ip_id
    visible: false

  - title: "Hidden Bastion Network"
    variables:
      - create_bastion
      - bastion_image_id
      - bastion_availability_domain
      - bastion_image_os
      - bastion_is_public
      - bastion_nsg_ids
      - bastion_public_ip
      - bastion_shape
      - bastion_image_os_version
      - bastion_user
      - subnet_type
      - create_new_vcn
      - create_subnets
#TODO: JOI review what is needed below this.
      - existent_private_subnet_ocid
      - existent_public_subnet_ocid
      - existent_vcn_compartment_ocid
      - existent_vcn_ocid
      - ipv6private_cidr_blocks
      - is_ipv6enabled
      - vcn_cidr_blocks
      - bastion_ssh_private_key
      - existing_bastion_instance_id
      - bastion_subnet_cidr
      - bastion_subnet_id
      - bastion_subnet_name
      - existing_admin_server_nsg_id
      - wls_subnet_name
      - wls_subnet_id
      - wls_subnet_cidr
      - wls_availability_domain_name
      - wait_time_wls_vnc_dns_resolver
      - use_regional_subnet
      - existing_bastion_nsg_id
    visible: false

variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Compartment"
    description: "The compartment in which to create compute instance(s)"
    required: true

  domain_name:
    type: string
    title: "Domain Name"
    required: true
    description: "Domain name to be restored from Object Storage Archives"

  # Bucket
  object_storage_bucket:
    type: string
    minLength: 1
    maxLength: 16
    title: "Object Storage bucket Title"
    description: "Type the name of the bucket in the specified compartment."
    required: false
    visible: false

  image_mode:
    visible: true
    type: enum
    title: "Image for each Weblogic Server instance"
    description: "The selected image is used when creating each Instance. A BYOL image requires a WebLogic License with valid support contract. UCM images are charged per OCPU/hour for the entitlement and WebLogic support."
    required: true
    enum:
      - "Oracle Weblogic Suite UCM Image"
      - "Oracle WebLogic Server Enterprise Edition UCM Image"
      - "Oracle WebLogic Server BYOL Image"

  terms_and_conditions:
    visible:
      and:
        - eq:
            - ${image_mode}
            - "Oracle WebLogic Server Enterprise Edition UCM Image"
    type: boolean
    default: false
    title: "Terms of use"
    description: "I have reviewed and accept the <a target=\"_blank\" href=\"https://objectstorage.us-phoenix-1.oraclecloud.com/n/axxu7cichsnt/b/terms/o/wlsoci_ee_terms_and_conditions.txt\">Oracle terms of use</a>"
    required: true

#### VCN Configuration variables
  use_existent_vcn:
    type: boolean
    title: "Use existing VCN for Weblogic Instances?"
    description: "Use an already provisioned Virtual Cloud Network and subnets"
    default: false

  wls_existing_vcn_id:
    visible:
      and:
        - use_existent_vcn
    type: oci:core:vcn:id
    dependsOn:
      compartmentId: network_compartment_id
    required: true
    default: ''
    title: "Existing Network"
    description: "An existing Virtual Cloud Network (VCN) in which to create the compute instances, network resources, and load balancers. Existing Virtual Cloud Network can be validated using the network validation script. See <a target=\"_blank\" href=\"https://docs.oracle.com/pls/topic/lookup?ctx=en/cloud/paas/weblogic-cloud/user&id=oci_network_validate\">Validate Existing Network Setup</a>"

  network_compartment_id:
    visible: true
    type: oci:identity:compartment:id
    title: "Network Compartment"
    description: "The compartment where you want to create the network resources such as Virtual Cloud Network, security lists, route tables and gateways."
    required: false
    default: compartment_ocid

  wls_vcn_name:
    visible:
      not:
        - use_existent_vcn
    type: string
    minLength: 1
    maxLength: 255
    pattern: "^[a-zA-Z_]\\w{0,254}$"
    required: true
    title: "Virtual Cloud Network Name"
    description: "The name of the new Virtual Cloud Network (VCN) to create for this service"

  wls_vcn_cidr:
    visible:
      not:
        - ${use_existent_vcn}
    type: string
    default: 10.0.0.0/16
    pattern: "^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\/(3[0-2]|[1-2]?[0-9])$"
    title: "Virtual Cloud Network CIDR"
    description: "The CIDR to assign to the new Virtual Cloud Network (VCN) to create for this service"

  subnet_compartment_id:
    visible:
      and:
        - not:
            - use_existent_vcn
        - not:
            - create_new_subnets
    type: oci:identity:compartment:id
    title: "Subnet Compartment"
    description: "The compartment where you have subnets created"
    required: true
    default: compartment_ocid

