#######################################
### End : VCN Configuration Variables
######################################
#######################################
### Section : Common Configuration Variables
######################################
  ssh_public_key:
    type: oci:core:ssh:publickey
    title: "Import your own SSH public key"
    additionalProps:
      allowMultiple: true
    required: false
    pattern: "((^(ssh-rsa AAAAB3NzaC1yc2|ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNT|ecdsa-sha2-nistp384 AAAAE2VjZHNhLXNoYTItbmlzdHAzODQAAAAIbmlzdHAzOD|ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1Mj|ssh-ed25519 AAAAC3NzaC1lZDI1NTE5|ssh-dss AAAAB3NzaC1kc3)[0-9A-Za-z+\/]+[=]{0,3})( [^,]*)?)(,((ssh-rsa AAAAB3NzaC1yc2|ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNT|ecdsa-sha2-nistp384 AAAAE2VjZHNhLXNoYTItbmlzdHAzODQAAAAIbmlzdHAzOD|ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1Mj|ssh-ed25519 AAAAC3NzaC1lZDI1NTE5|ssh-dss AAAAB3NzaC1kc3)[0-9A-Za-z+\/]+[=]{0,3})( [^,]*)?)*$"
    visible: true

  wls_instance_shape:
    type: oci:core:instanceshapewithflex:name
    title: "Select a flex or fixed shape for all Weblogic compute instances"
    required: true
    dependsOn:
      compartmentId: compartment_ocid
    # visible:
    #   and:
    #     - create_new_oke_cluster
    #     - show_advanced

  wls_visibility:
    type: enum
    enum:
      - "Private"
    title: "Oracle Weblogic Managed Server Instances will be hosted in private subnet(s)"
    required: true
    default: "Private"
  #######################################
  ### Section : Bastion Configuration Variables
  ######################################
  ssh_private_key:
    type: oci:core:ssh:publickey
    title: "Import your own SSH Private key"
    description: "Note: This SSH Private Key will only be used to connect to Bastion host to perform management tasks. You must remove it after provision and testing has completed."
    additionalProps:
      allowMultiple: true
    required: true
    pattern: "((^(ssh-rsa AAAAB3NzaC1yc2|ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNT|ecdsa-sha2-nistp384 AAAAE2VjZHNhLXNoYTItbmlzdHAzODQAAAAIbmlzdHAzOD|ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1Mj|ssh-ed25519 AAAAC3NzaC1lZDI1NTE5|ssh-dss AAAAB3NzaC1kc3)[0-9A-Za-z+\/]+[=]{0,3})( [^,]*)?)(,((ssh-rsa AAAAB3NzaC1yc2|ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNT|ecdsa-sha2-nistp384 AAAAE2VjZHNhLXNoYTItbmlzdHAzODQAAAAIbmlzdHAzOD|ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1Mj|ssh-ed25519 AAAAC3NzaC1lZDI1NTE5|ssh-dss AAAAB3NzaC1kc3)[0-9A-Za-z+\/]+[=]{0,3})( [^,]*)?)*$"
    visible: true

  bastion_instance_shape:
    type: oci:core:instanceshapewithflex:name
    title: "Select a flex or fixed shape for the Bastion compute instance"
    required: true
    dependsOn:
      compartmentId: compartment_ocid
    visible:
        bastion_customize_resource

  bastion_allowed_cidrs:
    type: array
    title: "List of CIDR blocks to allow SSH access to the bastion host"
    required: false
    description: "NOTE: Default is empty i.e. no access permitted. Allow access from anywhere with '0.0.0.0/0'. Specific network W.X.Y.Z/NN or individual host by IP followed by /32 X.X.X.X/32"
    items:
      type: string
    pattern: "^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\/(3[0-2]|[1-2]?[0-9])$"
    uniqueItems: true

  bastion_customize_resource:
    type: boolean
    default: false
    title: "Customize Bastion Instance"
    description: "Select Option if you want to customize further. Default Bastion configuration:  OCPUs: 1, Mem: 5Gb  Shape:VM.Standard.E4.Flex"
    visible: true
    required: true

  bastion_image_type:
    visible:
       bastion_customize_resource
    type: enum
    enum:
      - "Marketplace"
      - "Platform"
      - "Custom"
    title: "Select the type of Image for Bastion Instance"
    default: "Marketplace"
    required: false

  bastion_image_id:
    type: string
    required: true
    title: "Instance Image OCID"
    visible:
      and:
        - bastion_customize_resource
        - eq:
            - bastion_image_type
            - "Custom"
    pattern: ^ocid1.image.*$
    dependsOn:
      compartmentId: compartment_ocid

  bastion_upgrade:
    type: boolean
    default: false
    title: "Upgrade Bastion Packages?"
    description: "Whether to upgrade bastion packages after provisioning."
    visible:
        bastion_customize_resource
    required: false

  output_detail:
    type: boolean
    default: false
    title: "Verbose Output"
    description: "Whether to include detailed output in state."
    visible:
      bastion_customize_resource
    required: false
#  bastion_instance_visibility:
#    type: enum
#    enum:
#      - "Private"
#    title: "Bastion will be hosted in public or private subnet(s)"
#    required: true

#  create_bastion_subnet:
#    type: boolean
#    title: "Creates a new Bastion Subnet."
#    required: true

#  bastion_visibility:
#    type: enum
#    enum:
#      - "Private"
#      - "Public"
#    title: "Bastion will be hosted in public or private subnet(s)"
#    required: true
  #######################################
  ### End : Bastion Configuration Variables
  ######################################
  #Section: LoadBalancer Configuration
  ######################
  load_balancer_shape:
    type: enum
    enum:
      - "flexible"
    title: "Select a shape for the load balancer"
    visible:
      and:
        - show_advanced
  loadbalancer_authorized_cidrs_service:
    type: array
    title: "Authorized list of Network Addresses to connect Loadbalancer Application Ports"
    required: false
    description: "Type each network address in cidr format Y.Y.Y.Y/XX. Click after each type to be registered in the text area. Example Format: Network 192.168.1.0/24 or individual host by IP/32 . ex X.X.X.X/32"
    items:
      type: string
    pattern: "^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\/(3[0-2]|[1-2]?[0-9])$"
    uniqueItems: true
    default: [0.0.0.0/0]

  loadbalancer_authorized_cidrs_mgmt:
    type: array
    title: "Authorized list of Network Addresses to connect to Weblogic Console and Admin Ports exposed on the Loadbalancer"
    required: true
    description: "Type each network address in cidr format Y.Y.Y.Y/XX. Click after each type to be registered in the text area. Example Format: Network 192.168.1.0/24 or individual host by IP/32 . ex X.X.X.X/32"
    items:
      type: string
    pattern: "^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\/(3[0-2]|[1-2]?[0-9])$"
    uniqueItems: true
  #########################
  ### End: LoadBalancer Configuration
  #######################################
  tag_values:
    type: oci:identity:tag:value
    title: Tag Resources
    required: false
    visible: show_advanced
    dependsOn:
      compartmentId: compartment_ocid

