title: "Weblogic: Restore Weblogic Domain On-Premise Inventory"
description: Restory a Weblogic Domain to OCI from WLS Inventory.
informationalText: Creates OCI resources from a Weblogic Domain inventory.
schemaVersion: 1.1.0
version: "20230304"
locale: "en"

variableGroups:
  - title: "Hidden"
    visible: false
    variables:
      - api_fingerprint
      - config_file_profile
      - current_user_ocid
      - user_id
      - tenancy_id
      - tenancy_ocid
      - region
      - create_domain
      - wlsserver_pools
      - create_iam_autoscaler_policy # future use
      - create_iam_wlsserver_policy
      - ssh_public_key_path
      - ssh_private_key_path
      - custom_backends
      - allow_node_port_access

  - title: "Identity"
    variables:
      - compartment_ocid
      - create_iam_tag_namespace
      - create_iam_defined_tags
      - use_defined_tags
      - tag_namespace

  - title: "Network"
    variables:
      - ${create_vcn}
      - assign_dns
      - vcn_id
      - vcn_name
      - vcn_cidrs
      - vcn_dns_label
      - ig_route_table_id
      - vcn_create_internet_gateway
      - vcn_create_nat_gateway
      - vcn_create_service_gateway
      - nat_gateway_id
      - nat_route_table_id
      - nat_gateway_public_ip_id
      - service_gateway_id
      - create_drg
      - drg_id
      - local_peering_gateways

  - title: "Subnet: Weblogic Servers"
    variables:
      - wlsserver_is_public
      - wlsserver_subnet_create
      - wlsserver_subnet_newbits
      - wlsserver_subnet_id

  - title: "Network Security"
    variables:
      - ${create_nsgs}
      - managedserver_nsg_id
      - adminserver_nsg_id
      - allow_wlsserver_ssh_access
      - allow_adminserver_ssh_access
      - allow_wlsserver_internet_access
      - lockdown_default_seclist

  - title: "SSH"
    variables:
      - ssh_public_key
      - ssh_kms_vault_id
      - ssh_kms_secret_id

  - title: "Image"
    variables:
      - wlsserver_image_type
      - terms_and_conditions
      - wlsserver_image_os
      - wlsserver_image_os_version
      - wlsserver_image_platform_id
      - wlsserver_image_custom_id

  - title: "Instances"
    variables:
      - wlsserver_pool_mode
      - wlsserver_shape
      - wlsserver_pool_size
      - wlsserver_ocpus
      - wlsserver_memory
      - wlsserver_boot_volume_size
      - wlsserver_block_volume_type
      - wlsserver_use_encryption
      - wlsserver_volume_kms_vault_id
      - wlsserver_volume_kms_key_id
      - wlsserver_pv_transit_encryption
      - wlsserver_cloud_init_configure
      - wlsserver_cloud_init
      #      - wlsserver_cloud_init_byon
      #      - wlsserver_cloud_init_wls
      - wlsserver_tags

  - title: "Object Storage Archive Repository"
    variables:
      - bucket_name

  - title: "Weblogic Domain Common"
    variables:
      - ${add_load_balancer}
      - use_existing_loadbalancer
      - wlsserver_node_labels
      - existing_load_balancer_id
      - create_demo_certificate

  - title: "Loadbalancer"
    variables:
      - pub_lb_subnet_create
      - pub_lb_subnet_newbits
      - pub_lb_subnet_id
      - pub_lb_nsg_id
      - load_balancer_shape
      - lb_max_bandwidth
      - lb_min_bandwidth
      - loadbalancer_authorized_cidrs_mgmt
      - loadbalancer_authorized_cidrs_service
      - allow_rules_internal_lb
      - allow_rules_public_lb

  - title: "Bastion"
    variables:
      - create_bastion
      - bastion_subnet_create
      - bastion_subnet_newbits
      - bastion_is_public
      - bastion_subnet_id
      - bastion_allowed_cidrs
      - allow_bastion_domain_access
      - bastion_availability_domain
      - bastion_user
      - bastion_shape_name
      - bastion_shape_ocpus
      - bastion_shape_memory
      - bastion_shape_boot
      - bastion_shape
      - bastion_image_os
      - bastion_image_os_version
      - bastion_image_type
      - bastion_image_id
      - bastion_upgrade
      - bastion_tags

  - title: "Datasources Hidden"
    visible: false
    variables:
      - update_any_ds
      - update_ds_0
      - update_ds_1
      - update_ds_2
      - update_ds_3
      - update_ds_4
      - update_ds_5
      - update_ds_6
      - update_ds_7
      - update_ds_8
      - update_ds_9


  - title: "Datasource #0"
    variables:
      - ds_0
      - edit_ds_0
      - editable_ds_0

  - title: "Datasource #1"
    variables:
      - ds_1
      - edit_ds_1
      - editable_ds_1

  - title: "Datasource #2"
    variables:
      - ds_2
      - edit_ds_2
      - editable_ds_2
  - title: "Datasource #3"
    variables:
      - ds_3
      - edit_ds_3
      - editable_ds_3
  - title: "Datasource #4"
    variables:
      - ds_4
      - edit_ds_4
      - editable_ds_4
  - title: "Datasource #5"
    variables:
      - ds_5
      - edit_ds_5
      - editable_ds_5
  - title: "Datasource #6"
    variables:
      - ds_6
      - edit_ds_6
      - editable_ds_6
  - title: "Datasource #7"
    variables:
      - ds_7
      - edit_ds_7
      - editable_ds_7
  - title: "Datasource #8"
    variables:
      - ds_8
        edit_ds_8
      - editable_ds_8
  - title: "Datasource #9"
    variables:
      - ds_9
        edit_ds_9
      - editable_ds_9


## VARIABLES Definitions
variables:
  # Identity
  current_user_ocid:
    title: User
    type: ocid
    required: true
  tenancy_ocid:
    title: Tenancy
    type: oci:identity:compartment:id
    required: true
  compartment_ocid:
    title: Compartment
    description: The default compartment for created resources.
    type: oci:identity:compartment:id
    required: true
  region:
    required: true
    title: Region
    type: oci:identity:region:name

  create_iam_tag_namespace:
    default: false
    required: true
    title: Create tag namespace
    type: boolean
  create_iam_defined_tags:
    default: false
    required: true
    title: Create defined tags
    type: boolean
  use_defined_tags:
    title: Use defined tags
    default: false
    type: boolean
  tag_namespace:
    title: Tag namespace
    visible: ${use_defined_tags}
  defined_tags:
    visible: false
  freeform_tags:
    visible: false

  # VCN
  create_vcn:
    title: Create VCN
    type: boolean
    default: true
  vcn_id:
    title: Virtual Cloud Network
    type: oci:core:vcn:id
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
    visible: { not: [ create_vcn ] }
  vcn_name:
    title: Virtual Cloud Network (VCN) name
    description: Display name for the created VCN. Defaults to 'wls' suffixed with the generated Terraform 'state_id' value.
    type: string
    visible: ${create_vcn}
  assign_dns:
    title: Assign DNS records
    type: boolean
    default: true
    required: true
  vcn_dns_label:
    title: DNS label
    description: DNS label for the created VCN. Defaults to the generated Terraform 'state_id' value.
    visible:
      and:
        - ${create_vcn}
        - ${assign_dns}
  vcn_cidrs:
    title: CIDR ranges
    description: Comma-separated list of CIDR blocks for the created VCN.
    type: string
    required: true
    visible: ${create_vcn}
  lockdown_default_seclist:
    title: Secure default security list
    type: boolean
    required: true
    visible: ${create_vcn}
  vcn_create_internet_gateway:
    title: Create internet gateway
    type: boolean
    required: true
    visible: ${create_vcn}
  vcn_create_nat_gateway:
    title: Create service gateway
    type: boolean
    required: true
    visible: ${create_vcn}
  vcn_create_service_gateway:
    title: Create NAT gateway
    type: boolean
    required: true
    visible: ${create_vcn}
  local_peering_gateways:
    title: Local peering gateways
    visible: false
  ig_route_table_id:
    title: Internet Gateway Route Table
    type: ocid
    required: false
    visible:
      not:
        - ${create_vcn}
  service_gateway_id:
    title: Service gateway
    description: Existing service gateway in the VCN for access to Oracle Cloud services.
    type: oci:core:servicegateway:id
    required: true
    visible:
      not:
        - ${create_vcn}
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_id}
  nat_gateway_id:
    title: NAT gateway
    description: Existing NAT gateway in the VCN for private network egress.
    type: oci:core:natgateway:id
    required: true
    visible:
      not:
        - ${create_vcn}
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_id}

  #NSG
  create_nsgs:
    title: Create NSGs
    description: Create standard network security groups and traffic rules. Additional configuration may be required when disabled, e.g. providing existing NSGs, subnet security lists, etc.
    type: boolean
    default: true
    required: true
  managedserver_nsg_id:
    title: Weblogic Managed Server Network Security Group
    description: Network Security Groups for the created Weblogic Managed Server node(s), used to configure network access to instances. See <a href=https://docs.oracle.com/en-us/iaas/Content/ContEng/Concepts/contengnetworkconfig.htm#securitylistconfig>Security Rule Configuration in ... Network Security Groups</a> for more information.
    type: oci:core:nsg:id
    # additionalProps:
    #   allowMultiple: true
    required: false
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_id}
    visible: { not: [ create_nsgs ] }
  adminserver_nsg_id:
    title: Weblogic AdminServer Network Security Group
    description: Network Security Groups for the created AdminServer node, used to configure network access to instances. See <a href=https://docs.oracle.com/en-us/iaas/Content/ContEng/Concepts/contengnetworkconfig.htm#securitylistconfig>Security Rule Configuration in ... Network Security Groups</a> for more information.
    type: oci:core:nsg:id
    # additionalProps:
    #   allowMultiple: true
    required: false
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_id}
    visible: { not: [ create_nsgs ] }

  pub_lb_nsg_id:
    title: Attach existing NSG ?
    description: Network Security Groups for the created Public Load Balancer resource, used to configure network access to instances. See <a href=https://docs.oracle.com/en-us/iaas/Content/ContEng/Concepts/contengnetworkconfig.htm#securitylistconfig>Security Rule Configuration in ... Network Security Groups</a> for more information. Note - Select Option Existing VCN to discover and populate Drop Down
    type: oci:core:nsg:id
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_id}
    visible:
      and:
        - add_load_balancer
        - not:
            - create_nsgs

  ########################################################################
  # Subnets
  wlsserver_subnet_create:
    title: Create Weblogic Server subnet
    type: boolean
    required: true
  wlsserver_subnet_newbits:
    title: Weblogic Server subnet size
    description: The number of network prefix bits added to the VCN CIDR block for the created subnet address range (i.e. a higher value is smaller). Refer to the Terraform <a href=https://developer.hashicorp.com/terraform/language/functions/cidrsubnets>cidrsubnets</a> function for more information.
    type: number
    visible: ${wlsserver_subnet_create}

  wlsserver_subnet_id:
    title: Weblogic Server subnet
    description: VCN subnet for the primary network interface of created WebLogic Server node(s).
    type: oci:core:subnet:id
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_id}
      hidePublicSubnet: { not: [ wlsserver_is_public ] }
      hidePrivateSubnet: ${wlsserver_is_public}
      hideRegionalSubnet: false
      hideAdSubnet: false
    visible: { not: [ wlsserver_subnet_create ] }

  #Network Other
  wlsserver_is_public:
    title: Public Weblogic nodes
    type: boolean
    default: false
    required: true
    visible: ${create_nsgs}
  allow_node_port_access:
    title: Allow NodePort access
    type: boolean
    default: false
    required: true
    visible: ${create_nsgs}
  allow_wlsserver_ssh_access:
    title: Allow Weblogic Server SSH access
    type: boolean
    default: true
    required: true
    visible: ${create_nsgs}
  allow_adminserver_ssh_access:
    title: Allow Adminserver Server SSH access
    type: boolean
    default: true
    required: true
    visible: ${create_nsgs}
  allow_wlsserver_internet_access:
    title: Allow Weblogic Server egress to internet
    type: boolean
    default: true
    required: true
    visible: ${create_nsgs}
  allow_bastion_domain_access:
    title: Allow Bastion to access Weblogic Managed Servers
    type: boolean
    default: true
    required: true
    visible:
      and:
        - ${create_nsgs}
        - ${create_bastion}
  allow_rules_internal_lb:
    title: Additional internal load balancer rules
    additionalProps:
      allowMultiple: true
    required: false
    visible:
      and:
        - ${create_nsgs}
        - ${add_load_balancer}
  allow_rules_public_lb:
    title: Additional public load balancer rules
    additionalProps:
      allowMultiple: true
    required: false
    visible:
      and:
        - ${create_nsgs}
        - ${add_load_balancer}

  create_drg:
    title: Create DRG
    description: Create a Dynamic Routing Gateway and attach it to the VCN.
    type: boolean
    default: false
    required: false
    visible: false
  drg_id:
    title: Dynamic Routing Gateway
    description: Existing Dynamic Routing Gateway to attach to the VCN.
    type: ocid
    required: false
    visible: { not: [ create_drg ] }
  drg_display_name:
    title: DRG display name
    visible: ${create_drg}
  enable_waf:
    title: Enable WAF
    type: boolean
    default: false
    required: false
    visible: false

  ########################################################################
  #Bastion
  bastion_is_public:
    title: Public network
    description: Create a Bastion host on a Public Subnet and attach a public Ephimeral IP address.
    type: boolean
    default: true
    required: true
    visible:
      and:
        - ${bastion_subnet_create}
        - ${create_bastion}
  bastion_subnet_create:
    title: Create bastion subnet
    type: boolean
    default: true
    required: true
    visible : ${create_bastion}

  bastion_subnet_newbits:
    title: Bastion subnet size
    description: The number of network prefix bits added to the VCN CIDR block for the created subnet address range (i.e. a higher value is smaller). Refer to the Terraform <a href=https://developer.hashicorp.com/terraform/language/functions/cidrsubnets>cidrsubnets</a> function for more information.
    type: number
    visible:
      and:
        - ${bastion_subnet_create}
        - ${create_bastion}
  bastion_subnet_id:
    title: Bastion subnet
    type: oci:core:subnet:id
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_id}
      hidePublicSubnet: { not: [ bastion_is_public ] }
      hidePrivateSubnet: ${bastion_is_public}
      hideRegionalSubnet: false
      hideAdSubnet: false
    visible:
      not:
        - or:
            - ${bastion_subnet_create}
            - not:
                - ${create_bastion}
  create_bastion:
    title: Create bastion instance
    type: boolean
    default: false
    required: true
  bastion_availability_domain:
    title: Availability domain
    type: oci:identity:availabilitydomain:name
    required: false
    dependsOn:
      compartmentId: ${compartment_ocid}
    visible: ${create_bastion}
  bastion_allowed_cidrs:
    type: array
    title: "List of CIDR blocks allowed SSH access to the bastion host."
    required: false
    description: "Type each network address in cidr format Y.Y.Y.Y/XX followed by <Enter. Example Format: Network 192.168.1.0/24 or individual host by IP/32 . ex X.X.X.X/32"
    items:
      type: string
    pattern: "^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\/(3[0-2]|[1-2]?[0-9])$"
    uniqueItems: true
    default: [ 0.0.0.0/0 ]
    visible: ${create_bastion}

  bastion_user:
    title: User
    type: string
    default: opc
    required: true
    visible: ${create_bastion}
  bastion_shape_name:
    title: Shape
    type: oci:core:instanceshape:name
    default: "VM.Standard.E4.Flex"
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
    visible: ${create_bastion}
  bastion_shape_ocpus:
    title: OCPUs (Cores)
    type: number
    default: 4
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
    visible: ${create_bastion}
  bastion_shape_memory:
    title: Memory (GB)
    type: number
    default: 16
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
    visible: ${create_bastion}
  bastion_shape_boot:
    title: Boot volume size (GB)
    type: number
    default: 50
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
    visible: ${create_bastion}
  bastion_shape:
    visible: false
  bastion_image_os:
    title: Image OS
    description: Image operating system.
    type: enum
    default: "Oracle Autonomous Linux"
    enum: [ "Oracle Autonomous Linux", "Oracle Linux" ]
    required: true
    visible:
      and:
        - ${create_bastion}
        - not:
            - eq:
                - ${bastion_image_type}
                - custom
  bastion_image_os_version:
    title: Image OS version
    description: Image operating system version.
    type: enum
    default: "8.7"
    enum: [ "7.9", "8.7" ]
    required: true
    visible:
      and:
        - ${create_bastion}
        - not:
            - eq:
                - ${bastion_image_type}
                - custom
  bastion_image_type:
    title: Image type
    type: enum
    default: platform
    enum: [ platform, custom ]
    required: true
    visible: false
  bastion_image_id:
    title: Image ID
    type: oci:core:image:id
    required: false
    dependsOn:
      compartmentId: ${compartment_ocid}
      operatingSystem: ${bastion_image_os}
      operatingSystemVersion: ${bastion_image_os_version}
      shape: ${bastion_shape_name}
    visible: ${create_bastion}
  bastion_upgrade:
    title: Upgrade OS
    description: Upgrade the operating system on boot.
    type: boolean
    default: false
    required: true
    visible: ${create_bastion}
  bastion_tags:
    type: oci:identity:tag:value
    required: false
    title: Tagging
    description: Tag values for created resources.
    dependsOn:
      compartmentId: ${compartment_ocid}
    visible: ${create_bastion}

  # SSH
  ssh_public_key:
    title: SSH Public Key
    type: oci:core:ssh:publickey
    pattern: "((^(ssh-rsa AAAAB3NzaC1yc2|ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNT|ecdsa-sha2-nistp384 AAAAE2VjZHNhLXNoYTItbmlzdHAzODQAAAAIbmlzdHAzOD|ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1Mj|ssh-ed25519 AAAAC3NzaC1lZDI1NTE5|ssh-dss AAAAB3NzaC1kc3)[0-9A-Za-z+\/]+[=]{0,3})( [^,]*)?)(,((ssh-rsa AAAAB3NzaC1yc2|ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNT|ecdsa-sha2-nistp384 AAAAE2VjZHNhLXNoYTItbmlzdHAzODQAAAAIbmlzdHAzOD|ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1Mj|ssh-ed25519 AAAAC3NzaC1lZDI1NTE5|ssh-dss AAAAB3NzaC1kc3)[0-9A-Za-z+\/]+[=]{0,3})( [^,]*)?)*$"
    required: false
  ssh_kms_vault_id:
    title: SSH Vault
    description: The OCI Vault used to encrypt the SSH key pair.
    type: oci:kms:vault:id
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
  ssh_kms_secret_id:
    title: SSH Vault secret
    description: The OCI Vault secret containing the SSH private key.
    type: oci:kms:secret:id
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
      vaultId: ${ssh_kms_vault_id}


  # Weblogic Domain
  create_domain:
    title: Create Weblogic Managed Servers.
    description: Create Weblogic Managed servers and restore them from archive stored in Object Storage Bucket.
    default : true
    required : false
    visible : false
    type: bool

  ######################################
  #Section: LoadBalancer Configuration
  ######################
  add_load_balancer:
    title: Enable a Public Loadbalancer ?
    description: Add either a new or existing Public OCI Loadbalancer.
    default: false
    type: boolean

  use_existing_loadbalancer:
    title: Use existing LoadBalancer
    description: Select an Existing LoadBalancer from Compartment in section "Identity"
    default: false
    type: boolean
    visible: ${add_load_balancer}

  existing_load_balancer_id:
    type: oci:loadbalancer:loadbalancer:id
    #    pattern: ^(10)Mbps.*$
    title: Existing Load Balancer for "Weblogic Domain" migration Evaluation
    required: true
    default: ""
    dependsOn:
      compartmentId: ${compartment_ocid}
    visible:
      and:
        - use_existing_loadbalancer
        - add_load_balancer


  load_balancer_shape:
    type: enum
    title: "Select a shape for the load balancer"
    description: "Note: flexible loadbalancer shape will be the only shape supported for production environments. "
    default: "flexible"
    required: false
    enum:
      - "flexible"
      - "100Mbps"
      - "10Mbps"
      - "10Mbps-Micro"
      - "400Mbps"
      - "8000Mbps"
    visible:
      and:
        - add_load_balancer
        - not: use_existing_loadbalancer

  lb_max_bandwidth:
    title: Flexible Public Load Balancer Max Bandwith
    description: "Choose Maximum Shape for Flex Load Balancer."
    required: false
    type: enum
    default: "100"
    enum:
      - "10"
      - "100"
      - "1000"
      - "400"
      - "8000"
    visible:
      and:
        - and:
            - ${add_load_balancer}
            - not:
                - ${use_existing_loadbalancer}
        - eq:
            - load_balancer_shape
            - "flexible"

  lb_min_bandwidth:
    title: Public Load Balancer Min Bandwith
    description: "Choose Minimum Shape for Flex Load Balancer."
    required: false
    type: enum
    default: "100"
    enum:
      - "10"
      - "100"
      - "1000"
      - "400"
      - "8000"
    visible:
      and:
        - and:
            - ${add_load_balancer}
            - not:
                - ${use_existing_loadbalancer}
        - eq:
            - load_balancer_shape
            - "flexible"
  loadbalancer_authorized_cidrs_service:
    type: array
    title: "Authorized list of Network Addresses to connect Loadbalancer Application Ports"
    required: false
    description: "Type each network address in cidr format Y.Y.Y.Y/XX. Click after each type to be registered in the text area. Example Format: Network 192.168.1.0/24 or individual host by IP/32 . ex X.X.X.X/32"
    items:
      type: string
    pattern: "^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\/(3[0-2]|[1-2]?[0-9])$"
    uniqueItems: true
    default: [0.0.0.0/0]
    visible: ${add_load_balancer}

  loadbalancer_authorized_cidrs_mgmt:
    type: array
    title: "Authorized list of Network Addresses to connect to Weblogic Console and Admin Ports exposed on the Loadbalancer"
    required: false
    description: "Type each network address in cidr format Y.Y.Y.Y/XX. Click after each type to be registered in the text area. Example Format: Network 192.168.1.0/24 or individual host by IP/32 . ex X.X.X.X/32"
    items:
      type: string
    pattern: "^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]).(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\/(3[0-2]|[1-2]?[0-9])$"
    uniqueItems: true
    visible: ${add_load_balancer}

  pub_lb_subnet_create:
    title: Create public load balancer subnet
    type: boolean
    required: false
    visible:
      and:
        - add_load_balancer
        - not: use_existing_loadbalancer

  pub_lb_subnet_newbits:
    title: Public load balancer subnet size
    description: The number of network prefix bits added to the VCN CIDR block for the created subnet address range (i.e. a higher value is smaller). Refer to the Terraform <a href=https://developer.hashicorp.com/terraform/language/functions/cidrsubnets>cidrsubnets</a> function for more information.
    type: number
    visible:
      and:
        - ${pub_lb_subnet_create}
        - and:
            - ${add_load_balancer}
            - not:
                - ${use_existing_loadbalancer}


  pub_lb_subnet_id:
    title: Public load balancer subnet
    type: oci:core:subnet:id
    required: false
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_id}
      hidePublicSubnet: false
      hidePrivateSubnet: true
      hideRegionalSubnet: false
      hideAdSubnet: true
    visible:
      and:
        - and:
            - ${add_load_balancer}
            - not:
                - ${use_existing_loadbalancer}
        - not: [ pub_lb_subnet_create ]

  int_lb_subnet_create: # Future version
    title: Create internal load balancer subnet
    type: boolean
    required: false
    default: false
    visible: false

  int_lb_subnet_newbits: # Future version
    title: Internal load balancer subnet size
    description: The number of network prefix bits added to the VCN CIDR block for the created subnet address range (i.e. a higher value is smaller). Refer to the Terraform <a href=https://developer.hashicorp.com/terraform/language/functions/cidrsubnets>cidrsubnets</a> function for more information.
    type: number
    visible: ${int_lb_subnet_create}
    required: false

  int_lb_subnet_id:  # Future version
    title: Internal load balancer subnet
    type: oci:core:subnet:id
    required: false
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_id}
      hidePublicSubnet: true
      hidePrivateSubnet: false
      hideRegionalSubnet: false
      hideAdSubnet: true
    visible:
      not: ${int_lb_subnet_create}

  create_demo_certificate:
    title: Install a Test SSL Certificate?
    description: A generated Test certificate will be configured on Loadbalancer port 443/https.
    default: false
    type: boolean
    visible: ${add_load_balancer}

  #########################
  ### End: LoadBalancer Configuration
  #######################################

  # Weblogic Servers
  wlsserver_pool_mode:
    title: Resource type
    description: Type of Oracle Cloud Compute resources for the created Weblogic Servers. Note Other options in future releases
    type: enum
    default: Instances
    enum: [Instances] # Instance Pool
    required: true
  wlsserver_pool_size:
    title: Number of wlsserver nodes
    type: number
    default: 1
    required: true
    visible: false
  wlsserver_shape:
    title: Shape
    # type: oci:core:instanceshapewithflex:name
    type: oci:core:instanceshape:name
    default: "VM.Standard.E4.Flex"
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
  wlsserver_ocpus:
    title: OCPUs
    type: number
    default: 2
    required: false
  wlsserver_memory:
    title: Memory (GB)
    type: number
    default: 16
    required: false
  wlsserver_boot_volume_size:
    title: Boot volume size (GB)
    type: number
    required: false
  wlsserver_image_type:
    title: Image type
    description: Whether to use a Platform, UCM, or Custom image for Weblogic Server instances.
    type: enum
    default: "Oracle Weblogic Suite UCM"
    enum: ["Oracle WebLogic Server BYOL", "Oracle Weblogic Suite UCM", "Oracle WebLogic Server Enterprise Edition UCM"]
    required: true
  wlsserver_image_os:
    title: Operating system
    type: enum
    default: "Oracle Linux"
    enum: ["Oracle Linux"]
    required: true
    visible:
      not:
        - eq:
            - wlsserver_image_type
            - "Custom"
  wlsserver_image_os_version:
    title: Operating system version
    type: enum
    default: "8"
    enum: ["7.9", "8"]  #TODO: JOI  set os.auto.tfvars os version to values from discovered OS version.
    required: true
    visible:
      not:
        - eq:
            - wlsserver_image_type
            - "Custom"
  wlsserver_image_id:
    visible: false
  wlsserver_image_custom_id:
    title: Image ID
    type: ocid
    required: true
    pattern: ^ocid1.image.*$
    visible:
      eq:
        - wlsserver_image_type
        - "Custom"
  wlsserver_image_platform_id:
    title: Image
    type: oci:core:image:id
    required: true
    pattern: ^ocid1.image.*$
    dependsOn:
      compartmentId: ${compartment_ocid}
      operatingSystem: ${wlsserver_image_os}
      operatingSystemVersion: ${wlsserver_image_os_version}
      shape: ${wlsserver_shape}
    visible:
      eq:
        - wlsserver_image_type
        - "Oracle WebLogic Server BYOL"
  terms_and_conditions:
    visible:
      and:
        - not:
            - eq:
                - wlsserver_image_type
                - "Oracle WebLogic Server BYOL"
        - not:
            - eq:
                - wlsserver_image_type
                - "Custom"
    type: boolean
    default: false
    title: "UCM Image type selected. Do you accept the Terms of use ?"
    description: "I have reviewed and accept the <a target=\"_blank\" href=\"https://objectstorage.us-phoenix-1.oraclecloud.com/n/axxu7cichsnt/b/terms/o/wlsoci_ee_terms_and_conditions.txt\">Oracle terms of use</a>"
    required: true
  wlsserver_cloud_init:
    visible: false
  wlsserver_cloud_init_configure:
    type: boolean
    title: Custom cloud-init
    description: Override cloud-init for all instances.
    default : false
    visible : false
  wlsserver_cloud_init_byon:
    title: Cloud-init script
    type: text
    multiline: true
    required: false
    description: |
      Custom cloud-init script for wlsserver node startup configuration. Must include the default Weblogic initialization call to join the cluster and begin operation.
    visible:
      and:
        - wlsserver_cloud_init_configure
        - not:
            - eq:
                - wlsserver_pool_mode
                - Node Pool
  wlsserver_cloud_init_wls:
    title: Cloud-init script
    type: text
    multiline: true
    required: false
    description: |
      Custom cloud-init script for self-managed wlsserver node startup configuration. Must uncomment and define the two required parameters and include the default WLS initialization call to join the cluster and begin operation.
    visible:
      and:
        - wlsserver_cloud_init_configure
        - eq:
            - wlsserver_pool_mode
            - Node Pool
  wlsserver_block_volume_type:
    title: Block volume type
    type: enum
    enum: [Paravirtualized, iSCSI]
    default: iSCSI
    required: true
  wlsserver_node_labels:
    title: Node labels
    type: map
    required: false
    visible: false
  wlsserver_use_encryption:
    title: KMS volume encryption
    type: boolean
    default: false
    required: true
  wlsserver_volume_kms_vault_id:
    title: KMS volume encryption vault
    description: Vault containing operator volume encryption keys.
    type: oci:kms:vault:id
    required: false
    dependsOn:
      compartmentId: ${compartment_ocid}
    visible: wlsserver_use_encryption
  wlsserver_volume_kms_key_id:
    title: KMS volume encryption key
    type: oci:kms:key:id
    dependsOn:
      compartmentId: ${compartment_ocid}
      vaultId: ${wlsserver_volume_kms_vault_id}
    required: false
    visible: wlsserver_use_encryption
  wlsserver_pv_transit_encryption:
    title: In-transit volume encryption
    type: boolean
    default: false
    visible:
      eq:
        - wlsserver_block_volume_type
        - Paravirtualized
  wlsserver_tags:
    title: Tagging
    type: oci:identity:tag:value
    required: false
    description: Tag values for created resources.
    dependsOn:
      compartmentId: ${compartment_ocid}
  bucket_name:
    title: Object Storage Bucket name
    type: string
    required: true
    description: OCI Object Storage Bucket name where on-premise Weblogic archives are stored.
